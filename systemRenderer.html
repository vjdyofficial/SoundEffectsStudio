<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Renderer for AudioContext</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles-light.css" />
    <link rel="stylesheet" href="dseg.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="scroll-text.css" />
    <link rel="stylesheet" href="animation.css" />
  </head>

  <body data-drag="true">
    <div class="audioctx_info">
      <p aria-textstyle="title" id="24332df">Sub Renderer</p>
      <hr class="spacerelement" />
      <div class="sub">
        <p aria-textstyle="label">Sample Rate</p>
        <p aria-textstyle="info" id="25q24">0</p>
      </div>
      <div class="sub">
        <p aria-textstyle="label">State</p>
        <p aria-textstyle="info" id="2jeqw">0</p>
      </div>
      <div class="sub">
        <p aria-textstyle="label">Current Time</p>
        <p aria-textstyle="info" id="23rdw">0</p>
      </div>
      <div class="sub">
        <p aria-textstyle="label">Total Sends</p>
        <p aria-textstyle="info" id="4543ds">0</p>
      </div>
    </div>
    <hr>
    <div class="audioctx_info">
      <p aria-textstyle="title">Main Renderer</p>
      <hr class="spacerelement" />
      <div class="sub">
        <p aria-textstyle="label">Sample Rate</p>
        <p aria-textstyle="info" id="ertf3">0</p>
      </div>
      <div class="sub">
        <p aria-textstyle="label">Underrun Events</p>
        <p aria-textstyle="info" id="23fsd">0</p>
      </div>
      <div class="sub">
        <p aria-textstyle="label">Current Time</p>
        <p aria-textstyle="info" id="34tgr">0</p>
      </div>
    </div>
    <script src="systemRenderer.js"></script>
  </body>
</html>
