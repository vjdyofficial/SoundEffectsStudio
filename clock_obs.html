<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clock</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dseg.css">
    <link rel="stylesheet" href="fonts.css">
    <script src="clock.js" defer></script>
</head>

<body class="transparent" data-layout="obs-bottomright-clock">
    <div class="version_flex obsclockStyle">
        <span class="monosource_spanleft obsclockStyleFillHeader margin24">
            <h1 id="time" class="mns-text-display monospace_font mns_textcolor_accent_light mns-text-removepadding">12:00
            </h1>
            <hr class="spacerelement">
            <h4 class="mns-text-huge monospace_font mns_textcolor_accent50_light mns-text-removepadding" id="ampm">AM</h4>
        </span>
        <span class="monosource_span obsclockStyleFill margin12x24y">
            <p class="mns-text-larger monospace_font_sub mns-font-900" id="date">01 January 1970</p>
            <hr class="spacer">
        </span>
    </div>
</body>

</html>
