<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Console</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles_app.css">
    <link rel="stylesheet" href="styles-light.css">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="scroll-text.css">
    <style>
        :root {
            --topbarheight: 32px !important
        }
    </style>
    <script id="formats-system" type="module" src="modules/common/formats.js" defer=""></script>
</head>

<body class="transparent">
    <div class="titlebar">
        <picture class="monosource-iconwindow">
            <source srcset="images/icon-dark.svg" media="(prefers-color-scheme: dark)" />
            <source srcset="images/icon-light.svg" media="(prefers-color-scheme: light)" />
            <img src="images/icon-light.svg" alt="App logo" width="16px" height="16px" />
        </picture>
        <span class="monosource_span columnrow-init row">
            <img src="icons/codicons/error.svg" alt="icon" class="logo-onprimary">
            <p class="mns-text-small monospace_font" id="log-error-count">0</p>
        </span>
        <hr class="spacerelement">
        <span class="monosource_span columnrow-init row">
            <img src="icons/codicons/warning.svg" alt="icon" class="logo-onprimary">
            <p class="mns-text-small monospace_font" id="log-warn-count">0</p>
        </span>
        <hr class="spacerelement">
        <span class="monosource_span columnrow-init row">
            <img src="icons/codicons/info.svg" alt="icon" class="logo-onprimary">
            <p class="mns-text-small monospace_font" id="log-info-count">0</p>
        </span>
        <hr class="spacerelement">
        <span class="monosource_span columnrow-init row">
            <img src="icons/codicons/debug-alt-small.svg" alt="icon" class="logo-onprimary">
            <p class="mns-text-small monospace_font" id="log-debug-count">0</p>
        </span>
        <hr class="spacerelement">
        <hr class="spacer">
        <button id="pinbtn" class="monosource_windowbutton monosource_windowbuttonsquare disable-drag"
            title="Toggle Always on Top">
            <img id="pinIcon" src="icons/codicons/pin.svg" alt="About Icon" class="logo-onprimary">
        </button>
        <hr id="fullscreenspacer" class="monosource_windowbuttonspacer" style="--multiply: 3;">
    </div>
    <div class="andromeda_developer_console_layout">
        <div id="console" class="devconsole-panel"></div>
    </div>
    <script src="console.js"></script>
    <script id="app-system" src="core/monosource_console_logs_override.js"></script>
</body>

</html>
