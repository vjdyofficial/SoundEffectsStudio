<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Select Color</title>
  <link rel="stylesheet" href="styles.css" onerror="this.onerror=null;this.href='styles.css';">
  <link rel="stylesheet" href="dseg.css">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="scroll-text.css">
  <link rel="stylesheet" href="animation.css">
  <script id="app-system" src="colorpicker.js" defer></script>
</head>

<body class="transparent" data-layout="center">
  <div>
    <div class="content">
      <div id="playerControls" class="flex-start">
        <div class="widthfill">
          <p class="text_shrink">Basic colors</p>
          <div class="basic-colors widthfill" id="basicColors"></div>
        </div>
        <div class="row">
          <div>
            <p class="text_shrink">Custom Colors</p>
            <div class="spectrum-wrap">
              <canvas id="sv" width="350" height="180"></canvas>
              <canvas id="h" width="24" height="180"></canvas>
            </div>
          </div>
          <hr class="spacerelement">
          <div class="widthfill aligncenter row">
            <div class="widthfill">
              <p class="m2design_textbox_shrink">Hue</p>
              <input id="hNumber" type="number" min="0" max="360" value="343" maxlength="3"
                class="monosource_textbox m2design widthfill monospace_font">
            </div>
            <div class="widthfill">
              <p class="m2design_textbox_shrink">Saturation</p>
              <input id="sNumber" type="number" min="0" max="100" value="75" maxlength="3"
                class="monosource_textbox m2design widthfill monospace_font">
            </div>
            <div class="widthfill">
              <p class="m2design_textbox_shrink">Value</p>
              <input id="vNumber" type="number" min="0" max="100" value="71" maxlength="3"
                class="monosource_textbox m2design widthfill monospace_font">
            </div>

          </div>
          <hr class="spacerelement">
          <div class="widthfill aligncenter row">
            <div class="widthfill">
              <p class="m2design_textbox_shrink">Red</p>
              <input id="r" type="number" min="0" max="255" value="181" maxlength="3"
                class="monosource_textbox m2design widthfill monospace_font">
            </div>
            <div class="widthfill">
              <p class="m2design_textbox_shrink">Green</p>
              <input id="g" type="number" min="0" max="255" value="9" maxlength="3"
                class="monosource_textbox m2design widthfill monospace_font">
            </div>
            <div class="widthfill">
              <p class="m2design_textbox_shrink">Blue</p>
              <input id="b" type="number" min="0" max="255" value="57" maxlength="3"
                class="monosource_textbox m2design widthfill monospace_font">
            </div>
          </div>
        </div>
      </div>
    </div>
    <hr class="spacerelement">
    <div class="mns-button-placeholderwindow monosource_span">
      <p class="text_shrink">Chosen Color</p>
      <hr class="spacerelement2">
      <div id="preview" class="preview"></div>
      <hr class="spacerelement">
      <input id="hexInput" type="text" maxlength="7" placeholder="#rrggbb" value="#b50939"
        class="monosource_textbox width100 monospace_font">
      </button>
      <hr class="spacer">
      <button id="cancelBtn" class="monosource_secbutton">Cancel</button>
      <hr class="spacerelement">
      <button id="okBtn" class="monosource_secbutton">Set</button>
    </div>
  </div>
</body>

</html>
