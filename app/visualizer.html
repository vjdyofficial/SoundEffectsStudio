<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External HTML Visualizer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="visualizer.css">
    <link rel="stylesheet" href="animation.css">
    <script defer src="visualizer.js"></script>
</head>

<body>
    <div class="titlebar">
        <hr class="spacer">
        <button id="fullscrtoggle-btn"
            class="monosource_windowbutton disable-drag monosource_windowbutton_visiblebgstart"
            title="Toggle Fullscreen">
            <img id="fullscreenIcon" src="images/windows/enter-fullscreen.svg" alt="About Icon" height="12px">
        </button>
        <button id="pinbtn" class="monosource_windowbutton disable-drag monosource_windowbutton_visiblebg" title="Toggle Always on Top">
            <img id="pinIcon" src="icons/codicons/pin.svg" alt="icon" class="logo-onprimary_forceinvert">
        </button>
        <hr id="fullscreenspacer" class="monosource_windowbuttonspacer monosource_windowbutton_visiblebg"
            style="--multiply: 2;">
    </div>

    <div class="visualizer-wrapper">
        <div class="visualizer-container" id="visualizer-container">
            <canvas id="visualizer" style="position: absolute; top: 0; left: 0; z-index: 1;"></canvas>
            <div id="visualizerlayer0" class="visualizer-blur" style="position: absolute; top: 0; left: 0; z-index: 4;">
            </div>
            <div id="visualizerlayer1" class="visualizer-multiplycolor"
                style="position: absolute; top: 0; left: 0; z-index: 5;"></div>
            <video src="" id="media" style="position: absolute; top: 0; left: 0; z-index: 6; visibility: hidden;" muted
                playsinline>
                <track id="subtitleTrack1" kind="subtitles" srclang="en" label="subtitle1">
                <track id="subtitleTrack2" kind="subtitles" srclang="en" label="subtitle2">
            </video>
            <video src="" class="interlace-mask" id="media-interlace" style="position: absolute; top: 0; left: 0; z-index: 7; opacity: 0; visibility: hidden;" muted
                playsinline>
            </video>
            <div id="overlays" style="position: absolute; top: 0; left: 0; z-index: 15;">
                <div id="scaler" class="text-wrap80">
                    <h1 id="overlaytext"></h1>
                    <h1 id="overlaytext_L0" class="text-absolute"></h1>
                </div>
            </div>

            <div id="overlays2" style="position: absolute; top: 0; z-index: 9;">
                <div id="scalercaption" class="text-wrap80">
                    <h1 id="captionText1"></h1>
                    <h1 id="captionText1_L0" class="text-absolute_caption"></h1>
                </div>
            </div>

            <div id="overlays2" style="position: absolute; top: 0; z-index: 10;">
                <div id="scalercaption" style="position: relative;">
                    <h1 id="captionText2"></h1>
                    <h1 id="captionText2_L0" class="text-absolute_caption"></h1>
                </div>
            </div>

            <div id="overlays4" style="position: absolute; top: 0; z-index: 12; visibility: hidden;">
                <div id="scalercaptionLyrics" style="position: relative;">
                    <h1 id="captionTextLyrics"></h1>
                    <h1 id="captionTextLyrics_L0" class="text-absolute_caption"></h1>
                </div>
                <div id="scalercaptionLyrics" style="position: relative;">
                    <h1 id="captionTextLyrics2"></h1>
                    <h1 id="captionTextLyrics2_L0" class="text-absolute_caption"></h1>
                </div>
                <div id="scalercaptionLyrics" style="position: relative;">
                    <h1 id="captionTextLyrics3"></h1>
                    <h1 id="captionTextLyrics3_L0" class="text-absolute_caption"></h1>
                </div>
                <div id="scalercaptionLyrics" style="position: relative;">
                    <h1 id="captionTextLyrics4"></h1>
                    <h1 id="captionTextLyrics4_L0" class="text-absolute_caption"></h1>
                </div>
            </div>

            <div id="teleprompt_output" style="position: absolute; top: 0; z-index: 8;">
                <div id="scalercaption2">
                    <p id="telepromptText"></p>
                </div>
            </div>

            <div id="overlays3"
                style="position: absolute; top: 0; left: 0; z-index: 20; background-color: black; visibility: hidden;">
                <div id="scaler">
                    <h1 id="overlaytext2">
                        WebAudio detected that there's a changes to the input devices.
                        This content has been blocked to reconnect.
                        Please wait for a few moments and will signal this video output again.
                    </h1>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
