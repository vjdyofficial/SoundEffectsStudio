<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="splash.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="mns-progressbar.css">
</head>

<body class="transparent" data-layout="appregiondrag">
    <div style="position: relative; width: 800px; height: 600px;">
        <img class="splash-image logo" style="position: absolute; top: 0; left: 0; z-index: 1;" src="images/splash.svg"
            alt="Splash Image">
        <svg class="mdl-spinner progressbar-override" viewBox="0 0 50 50">
            <circle class="path_m3expressive" cx="25" cy="25" r="20" fill="none" stroke-width="2" />
            <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="6" />
        </svg>
        <p id="loadingText" style="position: absolute; top: 32px; left: 32px; z-index: 2;"></p>
        <audio preload="auto" id="initSound" src="audio/init.wav"></audio>
    </div>
    <script>
        document.addEventListener("keydown", (event) => {
            event.stopPropagation();
            event.preventDefault();
        });
    </script>
    <script>
        const { ipcRenderer } = require('electron');
        ipcRenderer.on('onload', (event, text) => {
            document.getElementById('loadingText').textContent = text;
        });
    </script>
</body>

</html>
