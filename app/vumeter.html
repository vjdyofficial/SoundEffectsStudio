<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VU Meter</title>
    <style>
        #vu-meter {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 8 / 5;
            height: 150px;
            background: transparent;
            overflow: hidden;
            pointer-events: none;
        }

        #vu-meter_38h {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 8 / 5;
            height: 150px;
            background: transparent;
            overflow: hidden;
            pointer-events: none;
        }

        .gradient-arc {
            position: absolute;
            top: 0;
            height: 100%;
            background-size: cover;
            transform-origin: center center;
            z-index: 0;
            pointer-events: none;
        }

        .needle {
            position: absolute;
            bottom: 0;
            left: calc(50% - 2px);
            width: 4px;
            height: 80%;
            background: color-scheme(light dark);
            background-color: #fff;
            transform-origin: bottom center;
            transform: rotate(-45deg);
            z-index: 1;
            pointer-events: none;
        }

        @media (prefers-color-scheme: dark) {
            .needle {
                background-color: #ffffff;
            }
        }

        @media (prefers-color-scheme: light) {
            .needle {
                background-color: #000000;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="fonts.css">
</head>

<body class="vumeter appregiondrag transparent">
    <div class="version_flex">
        <div class="version_flex vumeterStyle" id="audio-device-ui">
            <div id="vu-meter">
                <img class="gradient-arc logo" src="images/system/vumeter.svg" alt="VU Meter Background" width="300px"
                    height="150px">
                <div class="needle" id="micdev"></div>
            </div>
            <span class="monosource_span vumeterStyleFill margin16x8y">
                <p id="e400" class="mns-text-medium monospace_font_sub mns-font-900">Left Channel</p>
                <hr class="spacer">
            </span>
        </div>
        <hr id="spacer" class="spacerelement-large">
        <div class="version_flex vumeterStyle" id="sampler-ui">
            <div id="vu-meter">
                <img class="gradient-arc logo" src="images/system/vumeter.svg" alt="VU Meter Background" width="300px"
                    height="150px">
                <div class="needle" id="sampler"></div>
            </div>
            <span class="monosource_span vumeterStyleFill margin16x8y">
                <p id="e400" class="mns-text-medium monospace_font_sub mns-font-900">Right Channel</p>
                <hr class="spacer">
            </span>
        </div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');

        function valueToAngle(value) {
            const minValue = 0;    // input minimum
            const maxValue = 120;  // input maximum

            // Clamp the input
            const clamped = Math.min(Math.max(value, minValue), maxValue);

            // Convert to percent
            const percent = (clamped - minValue) / (maxValue - minValue); // 0 → 1

            // Map to angle
            return -45 + percent * 90; // -45 → +45
        }

        const vuLevels = {
            '#micdev': 0,      // start at min dB
            '#sampler': 0
        };

        function updateNeedleSmooth(query, rms) {
            const needle = document.querySelector(query);
            const targetDB = rms

            const attack = 0.5;   // rise speed (fast)
            const release = 0.2; // fall speed (slow)

            let current = vuLevels[query] || 0;

            if (targetDB > current) {
                current += (targetDB - current) * attack;
            } else {
                current += (targetDB - current) * release;
            }

            vuLevels[query] = current;

            const angle = valueToAngle(current);
            needle.style.transform = `rotate(${angle}deg)`;
        }

        ipcRenderer.on('vumeter-update', (event, dataL, dataR) => {
            updateNeedleSmooth('#micdev', dataL);
            updateNeedleSmooth('#sampler', dataR);
        });
    </script>
    <script>
        document.addEventListener("keydown", (event) => {
            event.stopPropagation();
            event.preventDefault();
        });
    </script>
</body>

</html>
