<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VU Meter</title>
    <style>
        #vu-meter {
            position: relative;
            width: 300px;
            height: 150px;
            background: transparent;
            overflow: hidden;
            pointer-events: none;
        }

        .gradient-arc {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 150px;
            z-index: 0;
            pointer-events: none;
        }


        .needle {
            position: absolute;
            bottom: 0;
            left: calc(50% - 2px);
            width: 4px;
            height: 125px;
            background: color-scheme(light dark);
            background-color: #fff;
            transform-origin: bottom center;
            transform: rotate(-45deg);
            transition: transform 0.005s linear;
            z-index: 1;
            pointer-events: none;
        }

        @media (prefers-color-scheme: dark) {
            .needle {
                background-color: #ffffff;
            }
        }

        @media (prefers-color-scheme: light) {
            .needle {
                background-color: #000000;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="fonts.css">
</head>

<body class="vumeter appregiondrag transparent">
    <div class="version_flex">
        <div class="version_flex vumeterStyle" id="audio-device-ui">
            <div id="vu-meter">
                <img class="gradient-arc logo" src="images/system/vumeter.svg" alt="VU Meter Background" width="300px"
                    height="150px">
                <div class="needle" id="micdev"></div>
            </div>
            <span class="monosource_span vumeterStyleFill margin16x8y">
                <p id="e400" class="mns-text-small monospace_font_sub mns-font-900">Audio Input Device</p>
                <hr class="spacer">
                <p id="avgText1" class="mns-text-small monospace_font_sub mns-font-400">-32.0 dB</p>
            </span>
        </div>
        <hr id="spacer" class="spacerelement-large">
        <div class="version_flex vumeterStyle" id="sampler-ui">
            <div id="vu-meter">
                <img class="gradient-arc logo" src="images/system/vumeter.svg" alt="VU Meter Background" width="300px"
                    height="150px">
                <div class="needle" id="sampler"></div>
            </div>
            <span class="monosource_span vumeterStyleFill margin16x8y">
                <p id="e400" class="mns-text-small monospace_font_sub mns-font-900">Sampler and Media</p>
                <hr class="spacer">
                <p id="avgText2" class="mns-text-small monospace_font_sub mns-font-400">-32.0 dB</p>
            </span>
        </div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');

        function updateNeedle(dataArray) {
            const needle = document.querySelector('#micdev');
            const maxPeak = 192; // The maximum peak value to reach the red label
            const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;

            total = dataArray.reduce((sum, value) => sum + value, 0);
            const dBArray = dataArray.map(v => 20 * Math.log10(v || 1));
            const avgDB = (dBArray.reduce((a, b) => a + b, 0) / dBArray.length).toFixed(100);
            document.getElementById('avgText1').textContent = `${(avgDB - 32).toFixed(1)} dB`;

            // Map average value to angle range (-45° to +45°)
            const percent = Math.min(avg / maxPeak, 1); // Clamp percent to [0,1]
            const angle = -45 + (percent * 90); // Total sweep: 90 degrees

            needle.style.transform = `rotate(${angle}deg)`;
        }

        ipcRenderer.on('vumeter-update', (event, dataArray) => {
            updateNeedle(dataArray); // Needle twitch ritual
        });

        function updateNeedle2(dataArray) {
            const needle = document.querySelector('#sampler');
            const maxPeak = 192; // The maximum peak value to reach the red label
            const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;

            total = dataArray.reduce((sum, value) => sum + value, 0);
            const dBArray = dataArray.map(v => 20 * Math.log10(v || 1));
            const avgDB = (dBArray.reduce((a, b) => a + b, 0) / dBArray.length).toFixed(100);
            document.getElementById('avgText2').textContent = `${(avgDB - 32).toFixed(1)} dB`;

            // Map average value to angle range (-45° to +45°)
            const percent = Math.min(avg / maxPeak, 1); // Clamp percent to [0,1]
            const angle = -45 + (percent * 90); // Total sweep: 90 degrees

            needle.style.transform = `rotate(${angle}deg)`;

            if (window.innerHeight >= 425) {
                document.getElementById('audio-device-ui').style.display = "block";
                document.getElementById('sampler-ui').style.display = "block";
                document.getElementById('spacer').style.display = "block";
            } else {
                // Follow your percent logic
                if (percent <= 0) {
                    document.getElementById('audio-device-ui').style.display = "block";
                    document.getElementById('sampler-ui').style.display = "none";
                    document.getElementById('spacer').style.display = "none";
                } else {
                    document.getElementById('audio-device-ui').style.display = "none";
                    document.getElementById('sampler-ui').style.display = "block";
                    document.getElementById('spacer').style.display = "none";
                }
            }
        }

        ipcRenderer.on('vumeter-update2', (event, dataArray) => {
            updateNeedle2(dataArray); // Needle twitch ritual
        });

        ipcRenderer.on('text', (event, text) => {});
    </script>
    <script>
        document.addEventListener("keydown", (event) => {
            event.stopPropagation();
            event.preventDefault();
        });
    </script>
</body>

</html>
