            overflow: hidden;
            pointer-events: none;
        }

        .gradient-arc {
            position: absolute;
            top: 0;
            height: 100%;
            background-size: cover;
            transform-origin: center center;
            z-index: 0;
            pointer-events: none;
        }

        .needle {
            position: absolute;
            bottom: 0;
            left: calc(50% - 2px);
            width: 4px;
            height: 80%;
            background: color-scheme(light dark);
            background-color: #fff;
            transform-origin: bottom center;
            transform: rotate(-45deg);
            z-index: 1;
            pointer-events: none;
        }

        @media (prefers-color-scheme: dark) {
            .needle {
                background-color: #ffffff;
            }
        }

        @media (prefers-color-scheme: light) {
            .needle {
                background-color: #000000;
            }
        }
    </style>

    <script>
        function valueToAngle(value) {
            const minValue = 0;    // input minimum
            const maxValue = 120;  // input maximum

            // Clamp the input
            const clamped = Math.min(Math.max(value, minValue), maxValue);

            // Convert to percent
            const percent = (clamped - minValue) / (maxValue - minValue); // 0 → 1

            // Map to angle
            return -45 + percent * 90; // -45 → +45
        }

        const vuLevels = {
            '#micdev': 0,      // start at min dB
            '#sampler': 0
        };

        function updateNeedleSmooth(query, rms) {
            const needle = document.querySelector(query);
            const targetDB = rms

            const attack = 1;   // rise speed (fast)
            const release = 0.5; // fall speed (slow)

            let current = vuLevels[query] || 0;

            if (targetDB > current) {
                current += (targetDB - current) * attack;
            } else {
                current += (targetDB - current) * release;
            }

            vuLevels[query] = current;

            const angle = valueToAngle(current);
            needle.style.transform = `rotate(${angle}deg)`;
        }

        const VUMeter = new BroadcastChannel('vumeter');

        VUMeter.onmessage = (e) => {
            if (e.data.type !== 'VU_METER') return;

            const { levelLVU, levelRVU } = e.data.data;

            // pass the correct variables
            updateNeedleSmooth('#micdev', levelLVU);
            updateNeedleSmooth('#sampler', levelRVU);
        };
    </script>

    <script>
        const { ipcRenderer } = require('electron');

        let lastFrame = performance.now();
        let fps = 0;

        // --- Functions ---
        function getFPS() {
            const now = performance.now();
            fps = Math.min(144, Math.max(0, 1000 / (now - lastFrame)));
            lastFrame = now;
            return fps;
        }

        setInterval(async () => {
            ipcRenderer.send('memory-update', {
                windowName: 'VU Meter', // give a unique name per window
                memory: {
                    fpsRate: fps.toFixed(1),
                }
            });
        }, 1000);

        // --- Main loop ---
        function updateFPS() {
            getFPS();
            requestAnimationFrame(updateFPS);
        }

        updateFPS();

        let pinwindow = false;

        document.getElementById('pinbtn').addEventListener('click', (e) => {
            pinwindow = !pinwindow;
            ipcRenderer.send('set-pinwindow', pinwindow);
        })

        ipcRenderer.on('icon-pinwindow', (event, bool) => {
            document.getElementById('pinIcon').src = bool ? 'icons/codicons/pinned.svg' : 'icons/codicons/pin.svg';
        })

        ipcRenderer.on('high-contrast-state', (event, isHighContrast) => {
            if (isHighContrast) {
                document.body.dataset.highcontrast = 'true';
            } else {
                document.body.dataset.highcontrast = 'false';
            }
        });

        ipcRenderer.on('window_state', (event, state) => {
            const titlebar = document.querySelector('.titlebar')
            if (titlebar) { titlebar.dataset.state = state }

            const titlebar_text = document.querySelector('.titlebar_fortext')
            if (titlebar_text) { titlebar_text.dataset.state = state }
        });

        let isFullscreen = false;

        // --- Fullscreen toggle button ---
        document.getElementById('fullscrtoggle-btn').addEventListener('click', () => {
            isFullscreen = !isFullscreen;
            ipcRenderer.send('advanced-vumenter', isFullscreen);

            document.getElementById("advanced-channel").hidden = !isFullscreen;
            document.getElementById('fullscreenIcon').src = isFullscreen
                ? 'icons/codicons/screen-normal.svg'
                : 'icons/codicons/screen-full.svg';
        });

        const channel = new BroadcastChannel("master-meter");

        const channelname = {
            2: "center",
            3: "lfe",
            4: "rearleft",
            5: "rearright",
            6: "sideleft",
            7: "sideright"
        };

        channel.onmessage = (event) => {
            const data = event.data;

            function normalizeDB(db) {
                const min = -45;
                const max = 10;
                return Math.max(0, Math.min(1, (db - min) / (max - min)));
            }

            if (data.type === "vu") {
                const channels = data.channels;
                if (!isFullscreen) { return };

                channels.forEach((ch, index) => {
                    const peak = ch.peak;
                    const peakScaled = ch.peakScaled;
                    updateNeedleSmooth(`#channel_${index}`, peakScaled)
                });
            }
        };

        ipcRenderer.on('isolate_component', (event, bool) => {
            document.getElementById('vucomp').hidden = bool;
        })
    </script>
