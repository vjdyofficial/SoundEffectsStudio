<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monosource Design Language</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="scroll-text.css">
</head>

<body data-layout="left">
    <h1>
        Monosource Design Language
    </h1>
    <hr class="spacerelement">
    <div class="column margin16">
        <h2>
            Scrolling Text
        </h2>
        <div class="scroll-text">
            <p data-direction="left">Hello world! This is a test!</p>
        </div>
        <div class="scroll-text">
            <p data-direction="right">Hello world! This is a test!</p>
        </div>
    </div>

    <div class="column margin16">
        <h2>
            Loading Progress Circular
        </h2>
        <svg class="mdl-spinner" viewBox="0 0 50 50">
            <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="4" />
        </svg>
        <svg class="mdl-spinner" viewBox="0 0 50 50">
            <circle class="path_m3expressive" cx="25" cy="25" r="20" fill="none" stroke-width="2" />
            <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="6" />
        </svg>
    </div>

    <div class="column margin16">
        <h2>
            Loading Progress Bar
        </h2>
        <div class="mns-progressbar progressbar-override">
            <div class="mns-progressbar-fill-in"></div>
            <div class="mns-progressbar-fill-out"></div>
        </div>
    </div>

    <div class="column margin16">
        <h2>
            Button Styles
        </h2>
        <button>Button</button>
        <hr class="spacerelement">
        <div class="columnrow_init column">
            <span class="monosource_span columnrow_init row">
                <p>Primary</p>
                <hr class="spacer">
                <button class="monosource_primarybutton">Button</button>
                <button class="monosource_primarybutton" disabled>Button</button>
            </span>
            <span class="monosource_span columnrow_init row">
                <p>Secondary</p>
                <hr class="spacer">
                <button class="monosource_secbutton">Button</button>
                <button class="monosource_secbutton" disabled>Button</button>
            </span>
            <span class="monosource_span columnrow_init row">
                <p>Outlined</p>
                <hr class="spacer">
                <button class="monosource_outlinebutton">Button</button>
                <button class="monosource_outlinebutton" disabled>Button</button>
            </span>
            <span class="monosource_span columnrow_init row">
                <p>Outlined 2</p>
                <hr class="spacer">
                <button class="monosource_outlinebutton2">Button</button>
                <button class="monosource_outlinebutton2" disabled>Button</button>
            </span>
        </div>
    </div>

    <div class="column margin16">
        <h2>
            Button Styles
        </h2>
        <button>Button</button>
        <hr class="spacerelement">
        <div class="columnrow_init column">
            <input type="checkbox" id="checkbox1">
            <input type="checkbox" class="monosource_checkbox" id="checkbox1">
            <input type="checkbox" class="monosource_switch" id="checkbox1">
            <input type="radio" name="radiochoose">
            <input type="radio" name="radiochoose">
            <input type="radio" class="monosource_radio" name="radiochoose2">
            <input type="radio" class="monosource_radio" name="radiochoose2">
        </div>
    </div>
</body>

</html>
